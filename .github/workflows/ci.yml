name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install runtime + dev dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check syntax (compile all Python files)
        run: python -m compileall -q netaudit_pkg netaudit.py web tests

      - name: Lint (ruff — full default rule set of the pinned version)
        # Ruff is pinned in requirements-dev.txt: its default rule set changes
        # between releases, and an unpinned upgrade could turn CI red with no
        # code change. Baseline for 1.0: zero findings. Every intentional
        # exception is a point-in-place `# noqa: RULE - reason` (blind except
        # at SSH/check boundaries, naive local timestamps the SQLite rows
        # already use) - no rule is disabled globally.
        run: ruff check netaudit_pkg netaudit.py web tests

      - name: Run tests
        run: python -m pytest tests/ -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Install security tools
        run: pip install bandit pip-audit
      - name: Bandit (LOW+ severity, project code excluding tests)
        # Baseline as of 2026-08-23: 0 unexplained findings. Every previously
        # reviewed finding has a point-in-place `# nosec TEST_ID - reason`
        # annotation in the code itself (see git log for the review). This
        # scan intentionally has NO blanket skips/exclusions by test ID -
        # any new finding not yet reviewed and annotated fails CI, which is
        # the point: it catches new potentially-risky patterns as they're
        # introduced, without re-litigating the already-reviewed baseline.
        run: bandit -r . --exclude ./tests,./.venv
      - name: pip-audit (fail on any known vulnerability)
        # Baseline as of 2026-08-23: 0 known vulnerabilities. No allowlist -
        # if a real CVE ever appears in a dependency, it must be triaged and
        # fixed (or the dependency pinned/replaced), not silently ignored.
        run: pip-audit -r requirements.txt
